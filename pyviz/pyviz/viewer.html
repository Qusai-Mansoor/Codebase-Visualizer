<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pyviz viewer</title>
  <script src="https://unpkg.com/cytoscape@3.28.0/dist/cytoscape.min.js"
          integrity="sha384-X7WMDD1lV+pn8w6J5+gz+4oe1KOb37V6QOOAFoNZHLuFqGfN3gKWUT5N7eiZewEo"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"
          integrity="sha384-2IH3T69EIKYC4c+RXZifZRvaH5SRUdacJW7j6HtE5rQbvLhKKdawxq6vpIzJ7j9M"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"
          integrity="sha384-u69h9ebXeSjlg6q/rb1zKTRAGu/h8deCl0409xpS/QJctMKnc4M9Fzkm01VOQdeF"
          crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #1e293b; }
    #cy { width: 100vw; height: 100vh; background: #fafafa; }

    #info {
      position: fixed; top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 24px);
      overflow: auto; background: #fff; border: 1px solid #e2e8f0; padding: 14px;
      border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    #info h3 { margin: 0 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 14px; word-break: break-all; }
    #info .kv { font-size: 12px; margin: 3px 0; }
    #info .kv b { color: #64748b; font-weight: 600; }
    #info .doc { margin-top: 8px; font-size: 12px; font-style: italic; color: #475569;
                 white-space: pre-wrap; border-top: 1px solid #f1f5f9; padding-top: 8px; }
    #info .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px;
                   background: #f1f5f9; color: #475569; margin-right: 4px; }

    #legend {
      position: fixed; bottom: 12px; left: 12px; background: rgba(255,255,255,.95);
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; font-size: 11px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }
    #legend .h { font-weight: 600; margin: 2px 0 4px; }
    #legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
    #legend .dot { width: 10px; height: 10px; border-radius: 3px; }
    #legend svg { display: block; }

    #toolbar {
      position: fixed; top: 12px; left: 12px; background: rgba(255,255,255,.95);
      border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 10px; font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06); display: flex; gap: 8px; align-items: center;
    }
    #toolbar input { border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font: inherit; width: 180px; }
    #toolbar .meta { color: #64748b; }
  </style>
</head>
<body>
  <div id="cy"></div>

  <div id="toolbar">
    <input id="search" type="text" placeholder="Filter nodes by name..." />
    <span class="meta" id="counts"></span>
  </div>

  <div id="info">Click a node to see details…</div>

  <div id="legend">
    <div class="h">Edges</div>
    <div class="row"><svg width="24" height="4"><line x1="0" y1="2" x2="24" y2="2" stroke="#3b82f6" stroke-width="1.5"/></svg> calls</div>
    <div class="row"><svg width="24" height="4"><line x1="0" y1="2" x2="24" y2="2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/></svg> inherits</div>
    <div class="row"><svg width="24" height="4"><line x1="0" y1="2" x2="24" y2="2" stroke="#a855f7" stroke-width="1.5"/></svg> decorates</div>
    <div class="row"><svg width="24" height="4"><line x1="0" y1="2" x2="24" y2="2" stroke="#9ca3af" stroke-width="1.5"/></svg> imports</div>
    <div class="h" style="margin-top:6px">Nodes</div>
    <div class="row"><span class="dot" style="background:#7c3aed"></span> package</div>
    <div class="row"><span class="dot" style="background:#3b82f6"></span> module</div>
    <div class="row"><span class="dot" style="background:#f59e0b"></span> class</div>
    <div class="row"><span class="dot" style="background:#22c55e"></span> function / method</div>
  </div>

  <script>
    const GRAPH = __GRAPH_DATA__;  // injected by the CLI at serve time

    const NODE_COLORS = {
      package: '#7c3aed', module: '#3b82f6', class: '#f59e0b',
      function: '#22c55e', method: '#22c55e', classmethod: '#22c55e',
      staticmethod: '#22c55e', property: '#14b8a6', decorator: '#a855f7',
      lambda: '#64748b', unknown: '#9ca3af',
    };
    const EDGE_COLORS = {
      calls: '#3b82f6', imports: '#9ca3af', inherits: '#ef4444',
      decorates: '#a855f7', contains: '#d1d5db',
    };

    const nodeIds = new Set(GRAPH.nodes.map(n => n.id));
    const elements = [
      ...GRAPH.nodes.map(n => ({ data: { id: n.id, label: n.name, kind: n.kind, raw: n } })),
      // only keep edges whose endpoints both exist (defensive; serializer already filters)
      ...GRAPH.edges
        .filter(e => nodeIds.has(e.src) && nodeIds.has(e.dst))
        .map(e => ({
          data: {
            id: e.src + '->' + e.dst + ':' + e.kind,
            source: e.src, target: e.dst, kind: e.kind,
            confidence: e.confidence, raw: e,
          },
        })),
    ];

    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements,
      wheelSensitivity: 0.2,
      style: [
        { selector: 'node', style: {
            'label': 'data(label)',
            'background-color': (ele) => NODE_COLORS[ele.data('kind')] || '#9ca3af',
            'text-valign': 'center', 'color': '#fff', 'font-size': 9,
            'font-family': 'ui-monospace, Menlo, monospace',
            'width': 'label', 'height': 18, 'padding': '6px',
            'shape': 'round-rectangle', 'text-max-width': '160px',
        }},
        { selector: 'node:selected', style: {
            'border-width': 3, 'border-color': '#1d4ed8',
        }},
        { selector: 'node.dim', style: { 'opacity': 0.15 } },
        { selector: 'edge', style: {
            'width': (ele) => ele.data('confidence') === 'both' ? 2.5 : 1.2,
            'line-color': (ele) => EDGE_COLORS[ele.data('kind')] || '#aaa',
            'target-arrow-color': (ele) => EDGE_COLORS[ele.data('kind')] || '#aaa',
            'target-arrow-shape': 'triangle', 'arrow-scale': 0.8,
            'curve-style': 'bezier',
            'line-style': (ele) => (ele.data('confidence') === 'dynamic' || ele.data('confidence') === 'unresolved') ? 'dashed' : 'solid',
        }},
        { selector: 'edge[kind="inherits"]', style: { 'line-style': 'dashed' } },
        { selector: 'edge.dim', style: { 'opacity': 0.05 } },
      ],
      layout: { name: 'dagre', rankDir: 'LR', nodeSep: 30, rankSep: 80 },
    });

    document.getElementById('counts').textContent =
      GRAPH.nodes.length + ' nodes · ' + elements.filter(e => e.data.source).length + ' edges';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }

    cy.on('tap', 'node', e => {
      const d = e.target.data('raw');
      const flags = ['is_async', 'is_abstract', 'is_protocol', 'is_dataclass', 'is_mixin']
        .filter(f => d[f]).map(f => f.replace('is_', ''));
      document.getElementById('info').innerHTML =
        '<h3>' + esc(d.name) + '</h3>' +
        '<div>' + ['<span class="badge">' + esc(d.kind) + '</span>']
          .concat(flags.map(f => '<span class="badge">' + esc(f) + '</span>')).join('') + '</div>' +
        '<div class="kv" style="margin-top:6px"><b>id</b> ' + esc(d.id) + '</div>' +
        '<div class="kv"><b>file</b> ' + esc(d.file || '-') + (d.line ? ':' + d.line : '') + '</div>' +
        (d.bases && d.bases.length ? '<div class="kv"><b>extends</b> ' + esc(d.bases.join(', ')) + '</div>' : '') +
        (d.role ? '<div class="kv"><b>role</b> ' + esc(d.role) + '</div>' : '') +
        (d.docstring ? '<div class="doc">' + esc(d.docstring) + '</div>' : '');
    });

    cy.on('tap', e => { if (e.target === cy) { document.getElementById('info').textContent = 'Click a node to see details…'; } });

    // Simple name filter — dims non-matching nodes/edges.
    document.getElementById('search').addEventListener('input', (ev) => {
      const q = ev.target.value.trim().toLowerCase();
      if (!q) { cy.elements().removeClass('dim'); return; }
      cy.nodes().forEach(n => {
        const match = (n.data('label') || '').toLowerCase().includes(q) ||
                      (n.data('id') || '').toLowerCase().includes(q);
        n.toggleClass('dim', !match);
      });
      cy.edges().forEach(e => {
        const keep = !e.source().hasClass('dim') && !e.target().hasClass('dim');
        e.toggleClass('dim', !keep);
      });
    });
  </script>
</body>
</html>
